<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파닉스 활용지</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Quicksand:wght@600;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  @page{size:A4;margin:12mm;}
  :root{--ink:#3a2333;--soft:#9c6d8c;--line:#c9b6c2;--accent:#e14c82;--pink:#ffe3ef;--blue:#e6effc;}
  *{box-sizing:border-box;}
  body{margin:0;background:#f3e9ef;font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif;color:var(--ink);
       -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .en{font-family:'Quicksand',sans-serif;font-weight:700;}
  .tools{position:sticky;top:0;z-index:5;background:#ff6fa0;color:#fff;padding:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;font-size:15px;}
  .tools .kind button{border:none;border-radius:10px;padding:8px 12px;font-family:'Jua',sans-serif;font-size:16px;cursor:pointer;background:rgba(255,255,255,.35);color:#fff;}
  .tools .kind button.on{background:#fff;color:#e14c82;}
  .tools label{display:inline-flex;align-items:center;gap:3px;}
  .tools select{font:inherit;border-radius:8px;border:none;padding:4px;}
  .tools .act{border:none;border-radius:10px;padding:8px 14px;font-family:'Jua',sans-serif;font-size:16px;cursor:pointer;background:#fff;color:#e14c82;text-decoration:none;}
  .page{width:186mm;min-height:271mm;margin:10px auto;background:#fff;position:relative;}
  @media screen{.page{width:202mm;min-height:287mm;padding:8mm;box-shadow:0 4px 14px rgba(0,0,0,.15);}}
  .page+.page{break-before:page;}
  @media print{body{background:#fff;}.tools{display:none;}.page{margin:0;}}
  .head{display:flex;align-items:flex-end;gap:10px;border-bottom:3px solid #ff6fa0;padding-bottom:6px;margin-bottom:10px;}
  .head h1{margin:0;flex:1;font-family:'Jua',sans-serif;font-weight:400;font-size:23px;color:var(--accent);}
  .head .fill{font-size:15px;white-space:nowrap;}
  .head .fill span{display:inline-block;width:30mm;border-bottom:2px solid var(--ink);margin:0 6px 0 4px;}
  .how{font-size:16px;margin:0 0 10px;}
  .foot{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:var(--soft);}
  @media screen{.foot{bottom:6mm;}}

  /* 소리 합치기 */
  .ref{border-collapse:collapse;margin:0 auto 12px;}
  .ref td{border:2px solid var(--ink);width:12mm;height:10mm;text-align:center;font-size:22px;}
  .ref td.h{background:#ffe9a8;font-family:'Jua',sans-serif;font-size:13px;width:16mm;}
  .ref td.plus{border:none;width:7mm;font-size:20px;}
  .ref .en{font-size:24px;}
  .tbl{width:100%;border-collapse:collapse;margin-bottom:12px;}
  .tbl th{background:var(--pink);border:2px solid var(--ink);font-family:'Jua',sans-serif;font-weight:400;font-size:15px;padding:4px;}
  .tbl td{border:2px solid var(--ink);height:11mm;text-align:center;font-size:20px;}
  .tbl td.q{background:#fafafa;width:30%;}
  .tbl tr.ex td{color:#8a7f88;}
  .tbl tr.ex td.q{color:var(--ink);}
  .fam-t{font-family:'Jua',sans-serif;font-size:17px;margin:4px 0;}
  .fam-t .en{color:var(--accent);font-size:20px;}

  /* 사이트워드 */
  .sw-top{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .sw-word{border:3px solid var(--ink);border-radius:10px;padding:2mm 10mm;font-family:'Quicksand',sans-serif;font-weight:700;font-size:44px;line-height:1.1;}
  .sw-bugs{flex:1;font-size:13px;color:var(--soft);}
  .sw-bugs svg{width:13mm;height:13mm;margin-right:1mm;}
  .sw-body{display:flex;gap:4mm;}
  .sw-sents{flex:1;display:grid;gap:5mm;}
  .sw-s{border:2px solid var(--ink);border-radius:4px;padding:8mm 6mm;font-family:'Quicksand',sans-serif;font-weight:600;font-size:34px;line-height:1.25;}
  .sw-pics{width:40mm;border:2px solid var(--ink);border-radius:4px;padding:2mm;text-align:center;align-self:stretch;}
  .sw-pics .t{font-size:13px;color:var(--soft);margin-bottom:2mm;}
  .sw-pic{margin-bottom:3mm;}
  .sw-pic span{display:block;font-size:34px;line-height:1.1;}
  .sw-pic b{font-family:'Quicksand',sans-serif;font-size:20px;}
</style>
</head>
<body>
<div class="tools">
  <span class="kind"><button data-k="blend">🧩 소리 합치기</button><button data-k="sight">📖 사이트워드</button></span>
  <span id="opt-blend">
    모음 <span id="vowel-checks"></span>
    · <label><input type="checkbox" id="ver-a" checked>영어→한글</label>
    <label><input type="checkbox" id="ver-b" checked>한글→영어</label>
  </span>
  <span id="opt-sight" class="hide-tool">
    <select id="from"></select> 부터 <select id="to"></select> 까지
    <label><input type="checkbox" id="with-pics" checked>그림 낱말 칸</label>
  </span>
  <button class="act" onclick="window.print()">🖨️ 인쇄 · PDF</button>
  <a class="act" href="index.html">◀ 로드맵</a>
</div>
<div id="pages"></div>

<script src="phonics-data.js"></script>
<script src="sight-data.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var kind = location.hash === '#sight' ? 'sight' : 'blend';
function head(title) {
  return '<div class="head"><h1>' + title + '</h1><div class="fill">이름<span></span> 날짜<span style="width:22mm"></span></div></div>';
}

// ── 소리 합치기 활용지: 모음 하나에 단어 가족 2개씩 한 장 ──
function refTable(words) {
  var onsets = [];
  words.forEach(function (x) { if (onsets.indexOf(x.w[0]) < 0) onsets.push(x.w[0]); });
  var v = words[0].w[1];
  var codas = [];
  words.forEach(function (x) { if (codas.indexOf(x.w[2]) < 0) codas.push(x.w[2]); });
  var row = function (h, f) {
    return '<tr><td class="h">' + h + '</td>' + onsets.map(function (c) { return '<td>' + f(c, 'o') + '</td>'; }).join('') +
      '<td class="plus">+</td><td>' + f(v, 'v') + '</td><td class="plus">+</td>' + codas.map(function (c) { return '<td>' + f(c, 'k') + '</td>'; }).join('') + '</tr>';
  };
  return '<table class="ref">' +
    row('알파벳', function (c) { return '<span class="en">' + c + '</span>'; }) +
    row('비슷한 소리', function (c, t) { return t === 'o' ? KO_ONSET[c] : t === 'v' ? KO_VOWEL[c] : KO_CODA[c]; }) + '</table>';
}
function blendTable(f, vowel, ver) {
  var ws = f[1].split('').map(function (c) { return c + f[0]; });
  var rows = ws.map(function (w, i) {
    var ex = i === 0;
    var plus = w[0] + ' + ' + w[1] + ' + ' + w[2];
    if (ver === 'a') return '<tr' + (ex ? ' class="ex"' : '') + '><td class="q en">' + plus + '</td><td>' + (ex ? koParts(w) : '') +
      '</td><td class="en">' + (ex ? w : '') + '</td><td>' + (ex ? koRead(w) : '') + '</td></tr>';
    return '<tr' + (ex ? ' class="ex"' : '') + '><td class="q">' + koParts(w) + '</td><td class="q" style="width:18%">' + koRead(w) +
      '</td><td class="en">' + (ex ? plus : '_ + _ + _') + '</td><td class="en">' + (ex ? w : '') + '</td></tr>';
  }).join('');
  var th = ver === 'a' ? '<tr><th>소리 합치기</th><th>한글 소리 조각</th><th>영어 단어</th><th>한글로 읽기</th></tr>'
                       : '<tr><th>한글 소리 조각</th><th>한글로 읽기</th><th>소리 합치기</th><th>영어 단어</th></tr>';
  return '<div class="fam-t"><span class="en">-' + f[0] + '</span> 가족</div><table class="tbl">' + th + rows + '</table>';
}
function blendPages() {
  var vs = VOWELS.filter(function (v) { return $('vc-' + v).checked; });
  var vers = [['a', $('ver-a').checked], ['b', $('ver-b').checked]].filter(function (x) { return x[1]; }).map(function (x) { return x[0]; });
  var h = '';
  vs.forEach(function (v) {
    var fs = FAMILIES[v];
    for (var i = 0; i < fs.length; i += 2) {
      var pair = fs.slice(i, i + 2);
      var words = [];
      pair.forEach(function (f) { f[1].split('').forEach(function (c) { words.push({ w: c + f[0] }); }); });
      vers.forEach(function (ver) {
        h += '<section class="page">' + head('🧩 단모음 소리 합치기 · <span class="en">' + v + '</span> (' + VOWEL_KO[v] + ')') +
          '<p class="how">' + (ver === 'a'
            ? '표를 보고 <b>한글 소리 조각</b>을 쓰고, 합쳐서 <b>영어 단어</b>와 <b>한글로 읽은 소리</b>를 써 보세요.'
            : '한글 소리를 보고 <b>알파벳</b>으로 바꿔서 <b>영어 단어</b>를 써 보세요.') + ' 첫 줄은 예시예요.</p>' +
          refTable(words) + pair.map(function (f) { return blendTable(f, v, ver); }).join('') + '</section>';
      });
    }
  });
  return h;
}

// ── 사이트워드 읽기 장 ──
var BUG = '<svg viewBox="0 0 40 40"><circle cx="20" cy="9" r="5" fill="#3b2a2a"/><ellipse cx="20" cy="23" rx="14" ry="13" fill="#fff" stroke="#3b2a2a" stroke-width="2"/>' +
  '<line x1="20" y1="11" x2="20" y2="36" stroke="#3b2a2a" stroke-width="1.6"/><circle cx="13" cy="20" r="3" fill="none" stroke="#3b2a2a" stroke-width="1.3"/>' +
  '<circle cx="27" cy="20" r="3" fill="none" stroke="#3b2a2a" stroke-width="1.3"/><circle cx="14" cy="29" r="2.5" fill="none" stroke="#3b2a2a" stroke-width="1.3"/>' +
  '<circle cx="26" cy="29" r="2.5" fill="none" stroke="#3b2a2a" stroke-width="1.3"/></svg>';
function sightPages() {
  var a = +$('from').value, b = +$('to').value, withPics = $('with-pics').checked, h = '';
  if (b < a) { var t = a; a = b; b = t; }
  for (var i = a; i <= b; i++) {
    var s = SIGHT[i], pics = sightNewPics(i);
    h += '<section class="page">' + head('📖 사이트워드 읽기 ' + (i + 1)) +
      '<div class="sw-top"><div class="sw-word">' + esc(s[0]) + '</div><div class="sw-bugs">' + BUG + BUG + BUG + BUG + BUG +
      '<br>문장을 모두 소리 내어 읽을 때마다 벌레를 하나씩 색칠해요.</div></div>' +
      '<div class="sw-body"><div class="sw-sents">' + s[1].map(function (x) { return '<div class="sw-s">' + esc(x) + '</div>'; }).join('') + '</div>' +
      (withPics ? '<div class="sw-pics"><div class="t">새 낱말</div>' + (pics.length ? pics.map(function (p) {
        return '<div class="sw-pic"><span>' + SIGHT_PICS[p] + '</span><b>' + p + '</b></div>';
      }).join('') : '<div class="t">다 아는 낱말!</div>') + '</div>' : '') + '</div></section>';
  }
  return h;
}

function build() {
  document.querySelectorAll('.kind button').forEach(function (b) { b.classList.toggle('on', b.dataset.k === kind); });
  $('opt-blend').style.display = kind === 'blend' ? '' : 'none';
  $('opt-sight').style.display = kind === 'sight' ? '' : 'none';
  $('pages').innerHTML = kind === 'blend' ? blendPages() : sightPages();
  var all = document.querySelectorAll('.page');
  all.forEach(function (p, i) { p.insertAdjacentHTML('beforeend', '<div class="foot">영어 소리코드 · ' + (i + 1) + '/' + all.length + '</div>'); });
}
$('vowel-checks').innerHTML = VOWELS.map(function (v) {
  return '<label><input type="checkbox" id="vc-' + v + '"' + (v === 'a' ? ' checked' : '') + '><span class="en">' + v + '</span></label>';
}).join(' ');
var opts = SIGHT.map(function (s, i) { return '<option value="' + i + '">' + (i + 1) + '. ' + esc(s[0]) + '</option>'; }).join('');
$('from').innerHTML = opts; $('to').innerHTML = opts; $('to').value = '4';
document.querySelectorAll('.tools input, .tools select').forEach(function (el) { el.onchange = build; });
document.querySelectorAll('.kind button').forEach(function (b) {
  b.onclick = function () { kind = b.dataset.k; history.replaceState(null, '', '#' + kind); build(); };
});
build();
</script>
</body>
</html>
